[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["crm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
