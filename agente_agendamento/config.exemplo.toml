# Configuração do agente de agendamento.
# Copie este arquivo para config.toml e ajuste com os seus dados.
# O config.toml não é versionado (está no .gitignore).

[fonte]
# Hoje o LiveClin não publica API, então o agente lê a planilha exportada.
# No LiveClin: exporte a lista de pacientes em CSV (ou XLSX) e aponte aqui.
tipo = "liveclin_csv"
caminho = "exemplos/pacientes_liveclin.csv"

# O agente reconhece sozinho os cabeçalhos mais comuns (Nome, Plano,
# Data início, Vencimento, Última consulta, Status, WhatsApp, Etiquetas).
# Só preencha esta seção se a sua exportação usar outros nomes.
# [fonte.colunas]
# nome = "Paciente"
# plano = "Pacote contratado"
# plano_inicio = "Começou em"
# ultima_consulta = "Último atendimento"

# Duração de cada tipo de plano, em dias.
[planos]
mensal = 30
trimestral = 90
semestral = 180
anual = 360

[agenda]
# "arquivo" guarda os compromissos num JSON local — funciona sem
# nenhuma credencial. Troque para "google_calendar" quando quiser
# escrever direto na sua agenda do Google.
tipo = "arquivo"
caminho = "agenda_local.json"

fuso = "America/Sao_Paulo"

# 1 = segunda ... 7 = domingo
dias_semana = [1, 2, 3, 4, 5]
horarios = ["08:00", "09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "17:00"]
duracao_min = 50

# Quantos dias antes do limite de 30 dias o agente começa a procurar vaga.
dias_de_busca = 7

# Não marca nada com menos de X horas de antecedência.
antecedencia_horas = 24

# "proximo_do_limite" mantém o intervalo mensal cheio (recomendado).
# "mais_cedo" antecipa o retorno sempre que houver vaga.
preferencia = "proximo_do_limite"

# Prazo para reencaixar quem já passou dos 30 dias.
dias_recuperacao = 7

# [agenda.google]
# calendar_id = "primary"
# credenciais = "credentials.json"
# token = "token.json"

[notificacoes]
# As mensagens de WhatsApp são montadas e gravadas aqui, prontas para
# envio. Nenhuma mensagem sai da máquina: falta plugar a API.
arquivo = "notificacoes.json"
