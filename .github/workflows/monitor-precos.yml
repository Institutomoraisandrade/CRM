name: Monitor de preços (a cada 6h)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar preços
        working-directory: produtos-fitness-dieta
        run: python monitor.py
      - name: Salvar histórico
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add produtos-fitness-dieta/produtos.json produtos-fitness-dieta/historico.csv produtos-fitness-dieta/alertas.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: atualiza histórico de preços" && git push)
